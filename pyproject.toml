[project]
name = "lter-api-dashboard"
version = "0.1.0"
description = "A Streamlit dashboard for the NES-LTER API"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "streamlit>=1.36",
    "polars>=1.0",
    "plotly>=6.0",
    "altair>=5.0",
    "pyarrow>=15.0",
    "xarray>=2024.1",
    "pydap>=3.4",
    "scipy>=1.10",
    "watchdog>=6.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]
